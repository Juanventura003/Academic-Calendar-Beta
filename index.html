<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Academic calendar</title>
    <link rel="stylesheet" href="Styles.css" />
  </head>
  <body>
    <table class="wrapper" align="center">    
      <!-- Header row - always visible -->
      <tr class="header">
        <td class="logo">
          <img
            src="https://engagecms-100936.campusnexus.cloud/ResourcePackages/CustomPortal/assets/dist/images/touroone/TouroOne_Blue Background.png"
            alt="TouroOne"
            width="300"
            height="64"
          />
        </td>
        <td class="heading">
          <h1 id="title"></h1>
          <div id="subtitle" class="subtitle"></div>
        </td>
      </tr>
      
      <!-- Container where schools will be dynamically inserted -->
      <tbody id="schools-container"></tbody>
      
      <!-- Footer spacer -->
      <tr>
        <td class="footer-spacer" colspan="2"></td>
      </tr>
    </table>

    <!-- Dynamic school generation script -->
    <script>
      console.log("Script is starting!");
      
      // Function to create HTML for one school
      function createSchoolHTML(schoolKey, index) {
        return `
          <tr>
            <td class="content" colspan="2">
              <details>
                <summary id="summary-school${index}">${schoolKey}</summary>
                
                <div class="legend">
                  <div class="legend-term">
                    <strong>Legend: </strong>
                    <p>Spring: <div class="spring-term-legend"></div></p>
                    <p>Summer: <div class="summer-term-legend"></div></p>
                    <p>Fall: <div class="fall-term-legend"></div></p>
                  </div>
                </div>
                
                <div id="intro-school${index}"></div>
                
                <div class="layout">
                  <section class="panel calendar">
                    <header class="panel-header blue-header">
                      <h2 id="calendar-header-school${index}">Academic Calendar (2025–2026)</h2>
                      <p class="muted inverted">June 2025 → May 2026</p>
                    </header>
                    <div id="calendarGrid-school${index}" class="calendar-grid"></div>
                  </section>
                  
                  <div class="side-column">
                    <section class="panel">
                      <header class="panel-header blue-header">
                        <h2>Calculations</h2>
                      </header>
                      <div class="panel-body" id="calculations-school${index}">
                        <ul class="mini-calculations" id="calculationsList-school${index}"></ul>
                      </div>
                    </section>
                    
                    <section class="panel">
                      <header class="panel-header blue-header">
                        <h2>Events</h2>
                      </header>
                      <div class="panel-body" id="events-school${index}">
                        <ul class="mini-events" id="eventsList-school${index}"></ul>
                      </div>
                    </section>
                  </div>
                </div>
                
                <div class="accordion">
                  <section class="panel">
                    <header class="panel-header blue-header">
                      <h2>More info</h2>
                    </header>
                  </section>
                </div>
              </details>
            </td>
          </tr>
          <tr>
            <td class="content center" colspan="2" id="extra-slot-school${index}"></td>
          </tr>
        `;
      }
      
      // Function to load events for a school
      function loadSchoolEvents(eventListId, schoolKey, data) {
        const listEl = document.getElementById(eventListId);
        
        if (listEl && data["2026"] && data["2026"][schoolKey]) {
          data["2026"][schoolKey].forEach(post => {
            const termClass = post.TERM_DESC.toLowerCase();
            listEl.insertAdjacentHTML('beforeend', `
              <li class="eventone ${termClass}">
                <strong>${post.EVENT_DESCRIPTION}</strong>
                <small>Code: ${post.EVENT_CODE} | Start: ${post.START} | End: ${post.END || 'TBD'}</small>
              </li>
            `);
          });
        }
      }
      
      // Fetch JSON and build everything dynamically
      fetch('./AcademicCalendar.json')
        .then(response => response.json())
        .then(data => {
          console.log("Full data:", data);
          
          const schoolsContainer = document.getElementById('schools-container');
          const schoolKeys = Object.keys(data["2026"]);
          
          console.log("Found schools:", schoolKeys);
          
          // Create HTML for each school
          schoolKeys.forEach((schoolKey, index) => {
            // Add 1 to index so IDs start at school1, school2, etc.
            const schoolIndex = index + 1;
            
            // Insert school HTML
            schoolsContainer.insertAdjacentHTML('beforeend', createSchoolHTML(schoolKey, schoolIndex));
            
            // Load events for this school
            loadSchoolEvents(`eventsList-school${schoolIndex}`, schoolKey, data);
          });
          
          // Build calendars for each school (after HTML is inserted)
          schoolKeys.forEach((schoolKey, index) => {
            const schoolIndex = index + 1;
            buildSchoolCalendar(
              `calendarGrid-school${schoolIndex}`, 
              `calculationsList-school${schoolIndex}`, 
              schoolKey
            );
          });
        })
        .catch(err => console.error('Error loading data:', err));
    </script>
    
    <!-- Calendar building script -->
    <script src="app.js"></script>
  </body>
</html>
