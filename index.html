<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport meta tag for mobile scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic calendar</title>
    <link rel="stylesheet" href="Styles.css" />
  </head>
  <body>
    <table class="wrapper">
      <!-- Header row - always visible -->
      <tr class="header">
        <td class="logo">
          <img
            src="https://engagecms-100936.campusnexus.cloud/ResourcePackages/CustomPortal/assets/dist/images/touroone/TouroOne_Blue Background.png"
            alt="TouroOne"
            style="max-width:300px; height:auto;"
          />
        </td>
        <td class="heading">
          <h1 id="title"></h1>
          <div id="subtitle" class="subtitle"></div>
          <div class="year-nav">
            <label for="year-select">Academic Year:</label>
            <select id="year-select">
              <option value="2024-2025">2024–2025</option>
              <option value="2025-2026">2025–2026</option>
              <option value="2026-2027">2026–2027</option>
            </select>
          </div>
        </td>
      </tr>
      
      <!-- Container where schools will be dynamically inserted -->
      <tbody id="schools-container"></tbody>
      
      <!-- Footer spacer -->
      <tr>
        <td class="footer-spacer" colspan="2"></td>
      </tr>
    </table>

    <!-- Dynamic school generation script -->
    <script>
      // Function to create HTML for one school
      function createSchoolHTML(schoolKey, index, friendlyNames) {
        const friendlyNamesHTML = friendlyNames.map(name => `<span class="school-friendly-name">${name}</span>`).join('');
        return `
          <tr>
            <td class="content" colspan="2">
              <details>
                <summary id="summary-school${index}">
                  <span class="school-names">${friendlyNamesHTML}</span>
                  <small class="school-pot-key">${schoolKey}</small>
                </summary>
                
                <div class="legend">
                  <div class="legend-term">
                    <strong>Legend: </strong>
                    <span>Spring: <span class="spring-term-legend"></span></span>
                    <span>Summer: <span class="summer-term-legend"></span></span>
                    <span>Fall: <span class="fall-term-legend"></span></span>
                  </div>
                </div>
                
                <div id="intro-school${index}"></div>
                
                <div class="layout">
                  <section class="panel calendar">
                    <header class="panel-header blue-header">
                      <h2 id="calendar-header-school${index}">Academic Calendar (2025–2026)</h2>
                      <p class="muted inverted">June 2025 → May 2026</p>
                    </header>
                    <div id="calendarGrid-school${index}" class="calendar-grid"></div>
                  </section>
                  
                  <div class="side-column">
                    <section class="panel">
                      <header class="panel-header blue-header">
                        <h2>Calculations</h2>
                      </header>
                      <div class="panel-body" id="calculations-school${index}">
                        <ul class="mini-calculations" id="calculationsList-school${index}"></ul>
                      </div>
                    </section>
                    
                    <section class="panel">
                      <header class="panel-header blue-header">
                        <h2>Events</h2>
                      </header>
                      <div class="panel-body" id="events-school${index}">
                        <ul class="mini-events" id="eventsList-school${index}"></ul>
                      </div>
                    </section>
                  </div>
                </div>
                
                <div class="accordion">
                  <section class="panel">
                    <header class="panel-header blue-header">
                      <h2>More info</h2>
                    </header>
                  </section>
                </div>
              </details>
            </td>
          </tr>
          <tr>
            <td class="content center" colspan="2" id="extra-slot-school${index}"></td>
          </tr>
        `;
      }
      
      // Function to load events for a school
      function loadSchoolEvents(eventListId, schoolKey, data, yearKey) {
        const listEl = document.getElementById(eventListId);

        if (listEl && data[yearKey] && data[yearKey][schoolKey]) {
          data[yearKey][schoolKey].forEach(post => {
            const termClass = post.TERM_DESC.toLowerCase();
            listEl.insertAdjacentHTML('beforeend', `
              <li class="eventone ${termClass}">
                <strong>${post.EVENT_DESCRIPTION}</strong>
                <small>Code: ${post.EVENT_CODE} | Start: ${post.START} | End: ${post.END || 'TBD'}</small>
              </li>
            `);
          });
        }
      }

      // Load calendar data for a given academic year (e.g. "2025-2026")
      function loadCalendar(year) {
        fetch(`./AcademicCalendar_${year}.json`)
          .then(response => response.json())
          .then(data => {
            const schoolsContainer = document.getElementById('schools-container');
            // Clear any previously rendered schools before building new ones
            schoolsContainer.innerHTML = '';

            // Grab the year key from the JSON dynamically (e.g. "2025")
            const yearKey = Object.keys(data)[0];
            const schoolKeys = Object.keys(data[yearKey]);

            // Update page subtitle to reflect the selected year
            document.getElementById("subtitle").textContent = year.replace('-', '–');

            // Create HTML for each school
            schoolKeys.forEach((schoolKey, index) => {
              const schoolIndex = index + 1;

              const friendlyNames = [...new Set(
                data[yearKey][schoolKey].map(event => event.ROLLUP_FRIENDLY_NAME).filter(Boolean)
              )];

              schoolsContainer.insertAdjacentHTML('beforeend', createSchoolHTML(schoolKey, schoolIndex, friendlyNames));
              loadSchoolEvents(`eventsList-school${schoolIndex}`, schoolKey, data, yearKey);
            });

            // Build calendars for each school (after HTML is inserted)
            schoolKeys.forEach((schoolKey, index) => {
              const schoolIndex = index + 1;
              buildSchoolCalendar(
                `calendarGrid-school${schoolIndex}`,
                `calculationsList-school${schoolIndex}`,
                schoolKey,
                data,
                yearKey
              );
            });
          })
          .catch(err => console.error('Error loading data:', err));
      }

      // Default year if nothing is specified in the URL
      const DEFAULT_YEAR = '2025-2026';

      // Read the "year" parameter from the URL (e.g. ?year=2025-2026)
      function getYearFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('year') || DEFAULT_YEAR;
      }

      // Sync the dropdown and load the calendar for the given year
      function applyYear(year) {
        document.getElementById('year-select').value = year;
        loadCalendar(year);
      }

      // Initial load — uses URL parameter if present, otherwise default
      applyYear(getYearFromURL());

      // When the user picks a different year, update URL and reload calendar
      document.getElementById('year-select').addEventListener('change', (e) => {
        const year = e.target.value;
        // Update the URL without reloading the page
        history.pushState({ year }, '', `?year=${year}`);
        loadCalendar(year);
      });

      // Handle browser back/forward buttons
      window.addEventListener('popstate', () => {
        applyYear(getYearFromURL());
      });
    </script>
    
    <!-- Calendar building script -->
    <script src="App.js"></script>
  </body>
</html>
